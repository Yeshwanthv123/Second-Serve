<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="870" viewBox="0 0 1200 870" role="img" aria-labelledby="title desc">
<title id="title">Second Serve application architecture</title><desc id="desc">React and Nginx connect to FastAPI. A Strands agent uses either a scripted demo provider or Amazon Bedrock and bounded domain tools. A human approves reservations. SQLite persists account data and run audit records. Ollama performs local model inference with downloaded weights in a separate Docker volume.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#82986e"/></marker><style>text{font-family:Arial,sans-serif;fill:#244535}.title{font-size:32px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:14px;fill:#5a7051}.tiny{font-size:12px;fill:#718263}.box{fill:#fffef8;stroke:#d7e1c9;stroke-width:1.5}.link{fill:none;stroke:#82986e;stroke-width:2;marker-end:url(#arrow)}</style></defs>
<rect width="1200" height="870" fill="#f5f7ef"/><text x="45" y="57" class="title">second serve / architecture</text><text x="46" y="85" class="small">Good food. Another chance. A complete coordination workflow.</text>
<rect x="40" y="122" width="1120" height="580" rx="20" fill="#edf2e3" stroke="#d6dfc8"/><text x="65" y="151" class="tiny">LOCAL DOCKER COMPOSE · PRIVATE ACCOUNT WORKSPACES</text>
<rect x="70" y="180" width="260" height="108" rx="12" class="box"/><text x="92" y="214" class="label">React + TypeScript</text><text x="92" y="241" class="small">Nginx · static UI + API proxy</text><text x="92" y="265" class="tiny">Login / location / food / partners / pickups</text>
<rect x="455" y="180" width="275" height="108" rx="12" class="box"/><text x="477" y="214" class="label">FastAPI</text><text x="477" y="241" class="small">Sessions + background planning</text><text x="477" y="265" class="tiny">Account-bound requests and tools</text>
<path d="M330 234H448" class="link"/><text x="358" y="220" class="tiny">HTTP / JSON</text>
<rect x="840" y="180" width="270" height="108" rx="12" class="box"/><text x="862" y="214" class="label">Private SQLite files</text><text x="862" y="241" class="small">Persistent named Docker volume</text><text x="862" y="265" class="tiny">Accounts / location / inventory / handoffs</text><path d="M730 234H833" class="link"/>
<rect x="455" y="345" width="275" height="108" rx="12" fill="#254d3b"/><text x="477" y="380" class="label" style="fill:#f5f7ef">Strands Agent</text><text x="477" y="407" class="small" style="fill:#c6d8b4">Bounded tool loop + run budget</text><text x="477" y="430" class="tiny" style="fill:#c6d8b4">inspect surplus → needs → create plan</text><path d="M592 288V338" class="link"/>
<rect x="70" y="345" width="260" height="108" rx="12" class="box"/><text x="92" y="379" class="label">Configured provider</text><text x="92" y="407" class="small">Default: Ollama / Qwen3 4B</text><text x="92" y="431" class="small">Optional: Bedrock / test script</text><path d="M455 400H337" class="link"/>
<rect x="840" y="345" width="270" height="108" rx="12" class="box"/><text x="862" y="379" class="label">Domain tools</text><text x="862" y="407" class="small">Capacity · diet · deadline · radius</text><text x="862" y="431" class="tiny">Compute and persist proposal only</text><path d="M730 400H833" class="link"/><path d="M975 345V295" class="link"/>
<rect x="70" y="540" width="260" height="108" rx="12" class="box"/><text x="92" y="574" class="label">Coordinator approves</text><text x="92" y="601" class="small">Review proposal and tool events</text><text x="92" y="624" class="tiny">Separate human action, no auto-dispatch</text>
<rect x="455" y="540" width="275" height="108" rx="12" class="box"/><text x="477" y="574" class="label">Atomic reservation</text><text x="477" y="601" class="small">Recheck → reserve → manifests</text><text x="477" y="624" class="tiny">Stale plans roll back · idempotent approval</text><path d="M330 594H448" class="link"/>
<rect x="840" y="540" width="270" height="108" rx="12" class="box"/><text x="862" y="574" class="label">Confirmed handoff</text><text x="862" y="601" class="small">Persist outcome → impact counts</text><text x="862" y="624" class="tiny">CSV + JSON downloads / human logistics</text><path d="M730 594H833" class="link"/><path d="M1110 594H1136V234H1117" class="link"/>
<path d="M70 234H53V594H63" class="link" stroke-dasharray="5 6"/><text x="46" y="735" class="tiny">Default Ollama requires no API key. Bedrock requires AWS credentials. AgentCore is a documented future option, not a deployed component. No external notifications.</text>
<rect x="40" y="755" width="1120" height="85" rx="12" fill="#edf2e3" stroke="#d6dfc8"/><text x="65" y="787" class="label">Location services</text><text x="65" y="815" class="small">React / Leaflet → OpenStreetMap tiles · FastAPI → cached Open-Meteo city search · device location requires permission</text></svg>
